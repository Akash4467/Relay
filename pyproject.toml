[project]
name = "relay"
version = "0.1.0"
description = "The Relay: citation-grounded Q&A over three arXiv papers under rate limits and overload"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pyyaml",
    "rank-bm25",
    "sentence-transformers",
    "faiss-cpu",
    "pymupdf",
    "pylatexenc",
    "tiktoken",
    "pandas",
    "numpy",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
