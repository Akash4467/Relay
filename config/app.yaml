prompt_version: p4                     # p4 (2026-11-14, phase 11B): prompt-only table caption sharing; p2: absence scoped to retrieved passages; p3 (2026-11-13): plain text, no LaTeX
verification_policy_version: v4.2      # v4.2 (2026-11-14, phase 10C): absence claims recognised by meaning (paraphrases; scope retrieved/paper/unscoped, only retrieved-scope allowed), candidate v5's P6 table check promoted verbatim, vague absence claims fail closed. v4.1 (2026-11-14, phase 10 L1): 【ID】 citations read as [ID], only when the bracket holds chunk IDs; nothing else changed. v4 (2026-11-13): v3 + sub/superscript groups kept, formulas must match a cited passage up to notation, absence sentences rejected when one retrieved sentence holds all their content words
generation_config_version: g1
corpus_version: c3                     # bump when chunks are rebuilt; c2 (2026-11-13): structured table rows; c3: specialrule fix
# phase 11D: which corpus is served (relay/corpus.py; docs/corpus_configuration.md). corpus_version above must equal the
# active entry's corpus_version (checked at startup). Rollback = set active (and corpus_version) back to c3.
# Paths are relative to the repository root. c6 is a selectable CANDIDATE, not active (activation needs approval).
corpus:
  active: c3
  corpora:
    c3:
      corpus_version: c3
      manifest_path: config/corpus_manifests/c3.json      # hashes recorded at the start of phases 9A/9B
      processed_data_path: data/processed
      index_path: data/index
    c6:
      corpus_version: c6
      manifest_path: experiments/phase10/corpus/c6/manifest.json
      processed_data_path: experiments/phase10/corpus/c6/processed
      index_path: experiments/phase10/corpus/c6/index

models:
  primary:  {id: openai/gpt-oss-120b, reasoning_effort: low, max_tokens: 900, temperature: 0.2}
  fallback: {id: openai/gpt-oss-20b,  reasoning_effort: low, max_tokens: 900, temperature: 0.2}

reservation:
  output_p95_tokens: {openai/gpt-oss-120b: 700, openai/gpt-oss-20b: 700}   # includes reasoning; refit from baseline
  safety_margin: 0.10
  # fixed tokens gpt-oss adds to every request (chat-format preamble): Groq reported 78 prompt tokens where the
  # local count was 11, identical on 120b and 20b (check_models, 2026-11-13)
  request_overhead_tokens: 67

pressure:                               # global, recomputed every 1 s
  L0: {context_cap: 2500, expansion: bounded, redraft: true}
  L1: {context_cap: 1500, expansion: paragraph_only, redraft: false,
       trigger: {primary_tpm_remaining_frac_lt: 0.5, or_queue_growing_for_s: 10}}
  L2: {context_cap: 1000, expansion: off, redraft: false,
       trigger: {primary_est_wait_ms_gt: 2000}}
  L3: {trigger: both_daily_quotas_exhausted}

retrieval_policy:
  # only when a question names >= 2 papers: candidates come from each named paper, and the context reserves
  # this many passages per named paper (at least one each always survives the token cap)
  cross_paper_reserve_per_paper: 2
  # phase 11B, Configuration G of phase 11A (7 gains, 0 losses offline): retrieval uses the paper-derived symbolic
  # expansion of the question (relay/retrieval/glossary.py; the original question is kept for generation and
  # verification), and the model-facing prompt shares a table caption across that table's chunks (the verifier
  # always gets the complete chunks). Read by the production callers (relay/main.py, the eval runners).
  symbolic_query_expansion: true
  prompt_caption_sharing: true

verification:
  # semantic support decides (DESIGN §14, 2026-11-12); thresholds are placeholders until fitted on the
  # verifier stress set (§19.6), never on test questions
  # PROVISIONAL (Akash, 2026-11-13): ANLI + P1 whole-sentence, t = 0.9 from stress round 2 calibration; no atomic split.
  # A stricter bar for flagged claims caught nothing more on round-2 calibration and added a false rejection, so
  # flags stay diagnostic (logged, sent back in redraft reasons) at the same threshold.
  nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  entail_min: 0.9           # every claim
  entail_min_flagged: 0.9   # claims with a level 2 warning (number, technical term, attribution)

model_decision:
  max_wait_for_primary_ms: 2000
  fallback_gate_categories: []          # filled from model benchmark (§19.4)

queue:
  max_length: 50
  semaphore_inflight_hosted_calls: 4

timeouts:
  connect_ms: 3000
  first_byte_ms: 15000
  stream_idle_ms: 8000                  # max gap between SSE chunks
  total_call_ms: 45000

retry:
  max_transport_retries_per_call: 2
  backoff_base_ms: 500
  backoff_cap_ms: 8000
  budget_frac_of_initial_per_min: 0.10

deadlines:
  default_patience_ms: 20000            # used when the client sends none

input:
  # /ask rejects (HTTP 400) an empty/whitespace question or one longer than this, before retrieval or any model
  # call (phase 10B, F1). The longest eval question is 213 characters.
  max_question_chars: 1000

cache:
  enabled: false                        # main experiments run with cache off
singleflight:
  enabled: false
